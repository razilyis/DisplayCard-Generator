<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard - Developer Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- コーディング用フォント -->
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700&family=Inconsolata:wght@400;700&family=Ubuntu+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #61AFEF;
            --keyword: #C678DD;
            --string: #98C379;
            --comment: #5C6370;
            --bg-color: #282C34;
            --main-font: 'Fira Code', monospace;
        }

        body {
            --ui-bg: #1e1e1e;
            --ui-panel: #21252B;
            --ui-panel-2: #1e1e1e;
            --ui-border: #3E4451;
            --ui-text: #abb2bf;
            --ui-muted: #5C6370;
            --ui-accent: var(--accent-color);
            --ui-accent-text: #21252B;
            color: #abb2bf;
        }

        /* Mac Window Style Card */
        .card {
            background-color: var(--bg-color);
            color: #abb2bf;
            border-radius: 6px;
            font-family: var(--main-font);
            /* 外周ラインは box-shadow で描く（border と違いレイアウトに影響しない） */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px #181A1F;
        }

        .title-bar {
            height: 12px;
            background-color: #21252B;
            display: flex;
            align-items: center;
            padding-left: 8px;
            border-bottom: 1px solid #181A1F;
            flex-shrink: 0;
        }

        .window-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot-red {
            background-color: #FF5F56;
        }

        .dot-yellow {
            background-color: #FFBD2E;
        }

        .dot-green {
            background-color: #27C93F;
        }

        .editor-content {
            min-height: 0;
            padding: 6px 12px;
            font-size: 6.5pt;
            line-height: 1.4;
            flex-grow: 1;
            position: relative;
            z-index: 10;
            white-space: pre-wrap;
            word-break: break-word;
            overflow: hidden;
        }

        .code-line {
            display: flex;
            align-items: flex-start;
        }

        .line-num {
            color: #4b5263;
            margin-right: 8px;
            user-select: none;
            text-align: right;
            display: inline-block;
            width: 12px;
            flex-shrink: 0;
        }

        .kw {
            color: var(--keyword);
        }

        .fn {
            color: var(--accent-color);
        }

        .str {
            color: var(--string);
        }

        .cmt {
            color: var(--comment);
            font-style: italic;
        }

        .punc {
            color: #abb2bf;
        }

        .dynamic-text {
            color: var(--accent-color) !important;
        }

        /* Editor Panel */
        .editor-panel {
            background: #252526;
            border-radius: 4px;
            padding: 1.5rem;
            border: 1px solid #333;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        input[type="text"],
        textarea,
        select {
            background-color: #1e1e1e;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            font-family: 'Fira Code', monospace;
            font-size: 10px;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        /* Buttons */
        .btn-dark {
            background-color: #333333;
            border: 1px solid #444;
            color: #eee;
            transition: all 0.2s;
        }

        .btn-dark:hover {
            background-color: #444;
        }

        .btn-accent {
            background-color: #007ACC;
            color: white;
            font-weight: 600;
            border: none;
        }

        .btn-accent:hover {
            background-color: #0062A3;
        }

        .color-swatch-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .color-dot {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid #3e3e42;
        }

        .color-dot:hover {
            transform: scale(1.1);
            z-index: 10;
            border-color: #fff;
        }

        .color-dot.active {
            border: 2px solid #fff;
        }

        .loader {
            border: 2px solid #333;
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #exportStatus {
            position: fixed;
            bottom: 20px;
            background: #252526;
            color: #fff;
            padding: 8px 16px;
            border: 1px solid #007ACC;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            display: none;
            z-index: 1000;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #3e3e42;
            border-radius: 0;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #007ACC;
            border-radius: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="w-full max-w-3xl flex justify-between items-center mb-8 px-4 font-mono">
        <a href="index.html" class="text-xs font-bold text-gray-500 hover:text-gray-300 transition">&lt; cd ..</a>
        <h1 class="text-xl font-bold text-gray-400 tracking-wider">./GENERATOR_CODE</h1>
        <div class="w-16"></div>
    </div>

    <div class="tool-container space-y-4">

        <div class="file-system-panel bg-[#252526] p-3 border border-[#333] w-full">
            <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-2 font-mono">//
                FILE_SYSTEM</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn"
                    class="btn-dark text-[10px] py-2 font-mono flex items-center justify-center gap-1"><span>save(json)</span></button>
                <button id="importJsonBtn"
                    class="btn-dark text-[10px] py-2 font-mono flex items-center justify-center gap-1"><span>load(json)</span></button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">
            </div>
        </div>

        <div id="captureArea">
            <div class="card" id="productCard">
                <div class="title-bar">
                    <div class="window-dots">
                        <div class="dot dot-red"></div>
                        <div class="dot dot-yellow"></div>
                        <div class="dot dot-green"></div>
                    </div>
                    <div class="flex-grow text-center text-[5px] text-gray-500 tracking-wider" id="displayTitleLabel">
                        PRODUCT_INFO.JS</div>
                </div>

                <div class="editor-content ck-fit ck-fit-box" id="codeEditorContainer" data-fit-min="0.7">
                    <!-- Dynamic Content -->
                </div>

                <div class="ck-watermark" id="displayBgTextContainer"
                    style="opacity: 0.05; --wm-right: -0.05em; --wm-bottom: -0.24em;">
                    <span id="displayBgText"
                        class="text-[100pt] font-bold tracking-tight uppercase whitespace-nowrap text-white">AF</span>
                </div>
            </div>
        </div>

        <div class="editor-panel">
            <div class="flex justify-between items-center mb-6 border-b border-[#333] pb-4">
                <h2 class="text-xs font-mono font-bold text-gray-400 flex items-center gap-2">>> CONFIGURATION</h2>
            </div>

            <div class="space-y-5">
                <!-- Font Selection -->
                <div>
                    <label
                        class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-2 font-mono">TYPEFACE</label>
                    <select id="fontSelect"
                        class="w-full text-xs p-2 border border-[#3e3e42] bg-[#1e1e1e] text-gray-300 font-mono h-8 cursor-pointer">
                        <option value="'Fira Code', monospace">FIRA CODE (LIGATURES)</option>
                        <option value="'JetBrains Mono', monospace">JETBRAINS MONO</option>
                        <option value="'Source Code Pro', monospace">SOURCE CODE PRO</option>
                        <option value="'Inconsolata', monospace">INCONSOLATA</option>
                        <option value="'Ubuntu Mono', monospace">UBUNTU MONO</option>
                    </select>
                </div>

                <!-- Syntax Colors -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label
                            class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest font-mono">SYNTAX_THEME</label>
                    </div>
                    <div class="color-swatch-grid" id="swatchGrid"></div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label
                            class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1 font-mono">CLASS_NAME
                            (Brand)</label>
                        <input type="text" id="brandNameInput" value="AroundForty" class="w-full text-xs p-2">
                    </div>

                    <div>
                        <label
                            class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1 font-mono">DOC_COMMENT
                            (Slogan)</label>
                        <textarea id="sloganInput" class="w-full text-xs p-2 h-16 mb-2">DESIGNED FOR THE MATURE MIND.
PRECISION ENGINEERED.</textarea>
                    </div>

                    <div class="p-3 bg-[#1e1e1e] border border-[#333]">
                        <label
                            class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-2 font-mono">BG_WATERMARK</label>
                        <input type="text" id="bgTextInput" value="AF" class="w-full text-xs p-2 mb-3 uppercase">
                        <div class="flex justify-between items-center mb-1">
                            <label
                                class="text-[9px] font-bold text-gray-500 uppercase tracking-widest font-mono">OPACITY</label>
                            <span id="opacityDisplay" class="text-[9px] font-mono text-blue-400">0.05</span>
                        </div>
                        <input type="range" id="opacityInput" min="0" max="0.2" step="0.01" value="0.05" class="w-full">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <!-- Model -->
                        <div>
                            <label
                                class="block text-[8px] font-bold text-gray-600 uppercase tracking-widest mb-1 font-mono">KEY_1</label>
                            <input type="text" id="codeNameLabelInput" value="model"
                                class="w-full text-[10px] p-1 mb-1 font-mono bg-[#333] border-none text-gray-400">
                            <input type="text" id="codeNameInput" value="AroundFortyRB" class="w-full text-xs p-2">
                        </div>
                        <!-- Switch -->
                        <div>
                            <label
                                class="block text-[8px] font-bold text-gray-600 uppercase tracking-widest mb-1 font-mono">KEY_2</label>
                            <input type="text" id="keySwitchLabelInput" value="switch"
                                class="w-full text-[10px] p-1 mb-1 font-mono bg-[#333] border-none text-gray-400">
                            <input type="text" id="keySwitchInput" value="Cherry MX Red" class="w-full text-xs p-2">
                        </div>
                        <!-- Keycaps -->
                        <div>
                            <label
                                class="block text-[8px] font-bold text-gray-600 uppercase tracking-widest mb-1 font-mono">KEY_3</label>
                            <input type="text" id="keyCapsLabelInput" value="keycaps"
                                class="w-full text-[10px] p-1 mb-1 font-mono bg-[#333] border-none text-gray-400">
                            <input type="text" id="keyCapsInput" value="PBT Double-shot" class="w-full text-xs p-2">
                        </div>
                        <!-- Owner -->
                        <div>
                            <label
                                class="block text-[8px] font-bold text-gray-600 uppercase tracking-widest mb-1 font-mono">KEY_4</label>
                            <input type="text" id="ownerLabelInput" value="owner"
                                class="w-full text-[10px] p-1 mb-1 font-mono bg-[#333] border-none text-gray-400">
                            <input type="text" id="ownerInput" value="@User" class="w-full text-xs p-2">
                        </div>
                    </div>
                    <div>
                        <label
                            class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1 font-mono">WINDOW_TITLE</label>
                        <input type="text" id="titleLabelInput" value="PRODUCT_INFO.JS"
                            class="w-full text-xs p-2 uppercase">
                    </div>
                </div>
            </div>

            <div class="pt-6 border-t border-[#333] mt-6">
                <button id="btnExport"
                    class="w-full py-4 px-4 btn-accent text-xs tracking-widest flex items-center justify-center gap-2 rounded">
                    <span>$ npm run build:png</span>
                </button>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        const escapeHtml = (v) => String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

        // エディタ風の本文はテキストではなく行単位の HTML なので、CardKit の onSync で組み立てる
        function renderCode() {
            const val = (id) => (document.getElementById(id) || {}).value || '';
            let line = 1, html = '';
            const nextNum = () => `<span class="line-num">${line++}</span>`;

            html += `<div class="code-line">${nextNum()}<div><span class="kw">const</span> <span class="fn">Brand</span> <span class="punc">=</span> <span class="kw">new</span> <span class="fn">${escapeHtml(val('brandNameInput'))}</span><span class="punc">();</span></div></div>`;
            html += `<div class="code-line">${nextNum()}</div>`;
            html += `<div class="code-line">${nextNum()}<span class="cmt">/**</span></div>`;
            val('sloganInput').split('\n').forEach((text) => {
                html += `<div class="code-line">${nextNum()}<span class="cmt">&nbsp;* ${escapeHtml(text)}</span></div>`;
            });
            html += `<div class="code-line">${nextNum()}<span class="cmt">&nbsp;*/</span></div>`;
            html += `<div class="code-line">${nextNum()}<div><span class="kw">export</span> <span class="kw">const</span> <span class="fn">Config</span> <span class="punc">=</span> <span class="punc">{</span></div></div>`;

            const items = [
                [val('codeNameLabelInput'), val('codeNameInput')],
                [val('keySwitchLabelInput'), val('keySwitchInput')],
                [val('keyCapsLabelInput'), val('keyCapsInput')],
                [val('ownerLabelInput'), val('ownerInput')]
            ];
            items.forEach(([label, value], i) => {
                const comma = i === items.length - 1 ? '' : '<span class="punc">,</span>';
                html += `<div class="code-line">${nextNum()}<div>&nbsp;&nbsp;<span class="fn">${escapeHtml(label)}</span><span class="punc">:</span>&nbsp;<span class="str">"${escapeHtml(value)}"</span>${comma}</div></div>`;
            });
            html += `<div class="code-line">${nextNum()}<span class="punc">};</span></div>`;

            document.getElementById('codeEditorContainer').innerHTML = html;
        }

        CardKit({
            theme: 'DEV',
            exportBg: '#282C34',
            nameSource: 'codeNameInput',
            onSync: renderCode,
            fields: [
                { input: 'brandNameInput', key: 'brandName' },
                { input: 'sloganInput', key: 'slogan' },
                { input: 'bgTextInput', target: 'displayBgText', key: 'bgText' },
                { input: 'titleLabelInput', target: 'displayTitleLabel', key: 'titleLabel' },
                { input: 'codeNameLabelInput', key: 'codeNameLabel' },
                { input: 'codeNameInput', key: 'codeName' },
                { input: 'keySwitchLabelInput', key: 'keySwitchLabel' },
                { input: 'keySwitchInput', key: 'keySwitch' },
                { input: 'keyCapsLabelInput', key: 'keyCapsLabel' },
                { input: 'keyCapsInput', key: 'keyCaps' },
                { input: 'ownerLabelInput', key: 'ownerLabel' },
                { input: 'ownerInput', key: 'owner' }
            ],
            ranges: [
                { input: 'opacityInput', display: 'opacityDisplay', target: 'displayBgTextContainer', style: 'opacity', unit: '', key: 'opacity' }
            ],
            selects: [
                { input: 'fontSelect', cssVar: '--main-font', key: 'font' }
            ],
            presets: {
                key: 'syntaxTheme',
                list: [
                    { id: 'atom-one-dark', label: 'Atom One Dark', vars: { '--accent-color': '#61AFEF', '--keyword': '#C678DD', '--string': '#98C379' } },
                    { id: 'vscode-dark', label: 'VS Code Dark', vars: { '--accent-color': '#9CDCFE', '--keyword': '#569CD6', '--string': '#CE9178' } },
                    { id: 'material-palenight', label: 'Material Palenight', vars: { '--accent-color': '#82AAFF', '--keyword': '#C792EA', '--string': '#C3E88D' } },
                    { id: 'monokai', label: 'Monokai', vars: { '--accent-color': '#66D9EF', '--keyword': '#F92672', '--string': '#E6DB74' } },
                    { id: 'nord', label: 'Nord', vars: { '--accent-color': '#83AFE5', '--keyword': '#EADDA0', '--string': '#42A38C' } },
                    { id: 'matrix', label: 'Matrix', vars: { '--accent-color': '#00FF41', '--keyword': '#008F11', '--string': '#003B00' } }
                ].map((p) => Object.assign(p, {
                    swatch: `conic-gradient(${p.vars['--keyword']} 0% 33%, ${p.vars['--accent-color']} 33% 66%, ${p.vars['--string']} 66% 100%)`
                }))
            }
        });
    </script>
</body>

</html>
