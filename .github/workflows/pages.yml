name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-source

      - name: Assemble site
        run: |
          mkdir -p _site/dev
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            main-source/ _site/
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            dev-source/ _site/dev/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
