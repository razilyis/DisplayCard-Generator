<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard - Neo Brutalism</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #FFDE00;
            --ink: #111111;
            --paper: #FFFDF5;
            --title-font: 'Archivo Black', sans-serif;
            --body-font: 'Space Grotesk', sans-serif;
        }

        body {
            --ui-bg: #F2F0E6;
            --ui-panel: #ffffff;
            --ui-panel-2: #FBFAF4;
            --ui-border: #111111;
            --ui-text: #111111;
            --ui-muted: #6b6b6b;
            --ui-accent: #111111;
            --ui-accent-text: #ffffff;
        }

        .editor-panel,
        .file-system-panel {
            border-width: 2px;
            border-radius: 0;
            box-shadow: 4px 4px 0 #111;
        }

        .ck-btn {
            border-width: 2px;
            border-radius: 0;
            box-shadow: 3px 3px 0 #111;
        }

        .card {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--body-font);
            padding: 4.5mm;
            /* 極太の黒枠はデザインそのものなので border のまま（プレビューでも出力でも同じ） */
            border: 3px solid var(--ink);
            justify-content: flex-start;
        }

        .nb-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 3mm;
        }

        .nb-brand {
            background: var(--accent-color);
            border: 2.5px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            padding: 1.4mm 2.2mm;
            font-family: var(--title-font);
            font-size: 15pt;
            line-height: 1.05;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            width: 62mm;
        }

        .nb-badge {
            flex-shrink: 0;
            width: 13mm;
            height: 13mm;
            border: 2.5px solid var(--ink);
            border-radius: 50%;
            background: var(--paper);
            box-shadow: 3px 3px 0 var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.05;
        }

        .nb-badge b {
            font-family: var(--title-font);
            font-size: 7pt;
            --fit-lh: 1.1;
            --fit-lines: 3;
            max-width: 10mm;
        }

        .nb-badge span {
            font-size: 3.6pt;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .nb-slogan {
            font-size: 7pt;
            font-weight: 700;
            line-height: 1.35;
            margin: 2.6mm 0 0;
            max-width: 68mm;
            flex: 1 1 auto;
        }

        .nb-chips {
            margin-top: auto;
        }

        .nb-chips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.6mm;
        }

        .nb-chip {
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0 var(--ink);
            background: #fff;
            padding: 1mm 1.2mm;
            min-width: 0;
        }

        .nb-chip i {
            display: block;
            font-style: normal;
            font-size: 3.6pt;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 0.3mm;
        }

        .nb-chip b {
            display: block;
            font-family: 'DM Mono', monospace;
            font-size: 5.8pt;
            --fit-lh: 1.15;
            --fit-lines: 3;
        }

        .nb-chip:nth-child(1) {
            background: var(--accent-color);
        }
    </style>
</head>

<body>
    <div class="page-head">
        <a href="index.html">← BACK TO MENU</a>
        <h1>Neo-Brutalism Generator</h1>
        <span class="ck-spacer"></span>
    </div>

    <div class="tool-container">
        <div class="file-system-panel ck-panel" style="padding:0.85rem">
            <label class="ck-label">📄 設定の保存 / 読み込み</label>
            <div class="ck-row">
                <button class="ck-btn" id="exportJsonBtn">📥 JSONで保存</button>
                <button class="ck-btn" id="importJsonBtn">📤 読み込む</button>
            </div>
            <input type="file" id="jsonFileInput" accept=".json" hidden>
        </div>

        <div id="captureArea">
            <div class="card" id="productCard">
                <div class="nb-top">
                    <div class="nb-brand ck-fit ck-fit-wrap" data-fit-solo="0.45" style="--fit-lines:2;--fit-lh:1.05" id="displayBrandName">AroundForty</div>
                    <div class="nb-badge">
                        <b class="ck-fit ck-fit-wrap" style="--fit-lines:2" id="displayMfgCode">02AFRB</b>
                        <span id="displayMfgCodeLabel">MFG</span>
                    </div>
                </div>

                <div class="nb-slogan" id="displaySlogan">DESIGNED FOR THE MATURE MIND.<br>MADE BY HAND, TWICE.</div>

                <div class="nb-chips">
                    <div class="nb-chip"><i id="displayCodeNameLabel">MODEL</i><b id="displayCodeName" class="ck-fit ck-fit-wrap">AroundFortyRB</b>
                    </div>
                    <div class="nb-chip"><i id="displayKeySwitchLabel">SWITCH</i><b id="displayKeySwitch" class="ck-fit ck-fit-wrap">Cherry MX
                            Red</b></div>
                    <div class="nb-chip"><i id="displayKeyCapsLabel">KEYCAPS</i><b id="displayKeyCaps" class="ck-fit ck-fit-wrap">PBT
                            Double-shot</b></div>
                    <div class="nb-chip"><i id="displayOwnerLabel">OWNER</i><b id="displayOwner" class="ck-fit ck-fit-wrap">@user</b></div>
                </div>
            </div>
        </div>

        <div class="editor-panel ck-panel">
            <label class="ck-label" style="margin-bottom:1rem">🎨 カードを編集</label>
            <div class="ck-field"><label class="ck-label" for="brandNameInput">ブランド名 / Brand</label><input type="text" id="brandNameInput" class="ck-input " value="AroundForty"></div>
            <div class="ck-field"><label class="ck-label" for="sloganInput">ひとこと / Slogan</label><textarea id="sloganInput" class="ck-textarea" rows="3">DESIGNED FOR THE MATURE MIND.
MADE BY HAND, TWICE.</textarea></div>
            <div class="ck-field"><div class="ck-section-head"><label class="ck-label">ブロックの色 / Block Color</label><span class="ck-value" id="colorLabelDisplay">—</span></div><div class="color-swatch-grid" id="swatchGrid"></div></div>
            <div class="ck-field"><label class="ck-label">項目1 (ラベル / 値)</label><input type="text" id="codeNameLabelInput" class="ck-input" value="MODEL" style="font-size:10px;opacity:.75;margin-bottom:4px"><input type="text" id="codeNameInput" class="ck-input" value="AroundFortyRB"></div>
            <div class="ck-field"><label class="ck-label">項目2 (ラベル / 値)</label><input type="text" id="keySwitchLabelInput" class="ck-input" value="SWITCH" style="font-size:10px;opacity:.75;margin-bottom:4px"><input type="text" id="keySwitchInput" class="ck-input" value="Cherry MX Red"></div>
            <div class="ck-field"><label class="ck-label">項目3 (ラベル / 値)</label><input type="text" id="keyCapsLabelInput" class="ck-input" value="KEYCAPS" style="font-size:10px;opacity:.75;margin-bottom:4px"><input type="text" id="keyCapsInput" class="ck-input" value="PBT Double-shot"></div>
            <div class="ck-field"><label class="ck-label">項目4 (ラベル / 値)</label><input type="text" id="ownerLabelInput" class="ck-input" value="OWNER" style="font-size:10px;opacity:.75;margin-bottom:4px"><input type="text" id="ownerInput" class="ck-input" value="@user"></div>
            <div class="ck-field"><label class="ck-label">項目5 (ラベル / 値)</label><input type="text" id="mfgCodeLabelInput" class="ck-input" value="MFG" style="font-size:10px;opacity:.75;margin-bottom:4px"><input type="text" id="mfgCodeInput" class="ck-input" value="02AFRB"></div>
            <hr class="ck-divider">
            <button class="ck-btn ck-btn-primary" id="btnExport">📸 高画質PNGで保存</button>
            <p class="ck-print-note">91×55mm / 600dpi・実寸情報つきPNG<br>印刷ソフトにそのまま置けば実寸で出ます</p>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'BRUT',
            exportBg: '#FFFDF5',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'brandNameInput', target: 'displayBrandName', key: 'brandName' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'codeNameLabelInput', target: 'displayCodeNameLabel', key: 'codeNameLabel' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'keySwitchLabelInput', target: 'displayKeySwitchLabel', key: 'keySwitchLabel' },
                { input: 'keySwitchInput', target: 'displayKeySwitch', key: 'keySwitch' },
                { input: 'keyCapsLabelInput', target: 'displayKeyCapsLabel', key: 'keyCapsLabel' },
                { input: 'keyCapsInput', target: 'displayKeyCaps', key: 'keyCaps' },
                { input: 'ownerLabelInput', target: 'displayOwnerLabel', key: 'ownerLabel' },
                { input: 'ownerInput', target: 'displayOwner', key: 'owner' },
                { input: 'mfgCodeLabelInput', target: 'displayMfgCodeLabel', key: 'mfgCodeLabel' },
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' }
            ],
            accent: {
                cssVar: '--accent-color',
                default: '#FFDE00',
                labelDisplay: 'colorLabelDisplay',
                swatches: [
                    { hex: '#FFDE00', label: 'YELLOW' }, { hex: '#FF5C39', label: 'TANGERINE' },
                    { hex: '#FF7BAC', label: 'BUBBLEGUM' }, { hex: '#7CE577', label: 'SLIME' },
                    { hex: '#63C7FF', label: 'SKY' }, { hex: '#B79CFF', label: 'LILAC' },
                    { hex: '#FFFFFF', label: 'PAPER' }, { hex: '#111111', label: 'INK' }
                ]
            }
        });
    </script>
</body>

</html>
