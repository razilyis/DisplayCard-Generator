<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard Generator [OCEAN]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700&family=Inter:wght@400;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #00f2fe;
            --bg-color: #031b2e;
            --main-font: 'Barlow Condensed', sans-serif;
        }

        body {
            --ui-bg: #02111d;
            --ui-panel: #062640;
            --ui-panel-2: #02111d;
            --ui-border: #0c4a6e;
            --ui-text: #e0f2fe;
            --ui-muted: #38bdf8;
            --ui-accent: var(--accent-color);
            --ui-accent-text: #000;
        }

        .card {
            background-color: var(--bg-color);
            color: #e0f2fe;
            padding: 6mm 7mm;
            font-family: var(--main-font);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.2), inset 0 0 0 1px rgba(0, 242, 254, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-image: 
                radial-gradient(ellipse at 50% -20%, rgba(0, 242, 254, 0.35) 0%, transparent 60%),
                linear-gradient(180deg, #031b2e 0%, #010a14 100%);
        }

        .caustics {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 10%, transparent 20%);
            background-size: 24px 24px;
            pointer-events: none;
            opacity: 0.7;
        }

        .ocean-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(0, 242, 254, 0.3);
            padding-bottom: 1.5mm;
            position: relative;
            z-index: 2;
        }

        .depth-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 7.5pt;
            letter-spacing: 0.15em;
            color: var(--accent-color);
        }

        .aqua-badge {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 6.5pt;
            letter-spacing: 0.1em;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
        }

        .ocean-title-box {
            margin: 2mm 0;
            position: relative;
            z-index: 2;
        }

        .ocean-title {
            font-size: 18pt;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            line-height: 1.05;
            text-transform: uppercase;
        }

        .ocean-sub {
            font-family: 'Inter', sans-serif;
            font-size: 7.5pt;
            color: #7dd3fc;
            margin-top: 1mm;
        }

        .ocean-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5mm 4mm;
            background: rgba(1, 15, 30, 0.7);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 2.5mm 3.5mm;
            border-radius: 4px;
            position: relative;
            z-index: 2;
        }

        .ocean-item-label {
            font-size: 6pt;
            color: #38bdf8;
            display: block;
            letter-spacing: 0.08em;
            font-family: 'Share Tech Mono', monospace;
        }

        .ocean-item-val {
            font-size: 8.5pt;
            font-weight: 700;
            color: #f0f9ff;
            font-family: 'Inter', sans-serif;
        }

        .dynamic-text { color: var(--accent-color) !important; }
        .dynamic-bg { background-color: var(--accent-color) !important; }
        .dynamic-border { border-color: var(--accent-color) !important; }
    </style>
</head>

<body>
    <div class="w-full max-w-6xl flex justify-between items-center mb-6 px-4">
        <a href="index.html" class="text-xs font-bold text-sky-400 hover:text-white transition">← MENU</a>
        <h1 class="text-lg font-black text-sky-300 tracking-tight uppercase">Ocean Generator</h1>
        <div class="w-16"></div>
    </div>

    <div class="tool-container">
        <div class="file-system-panel bg-[#062640] p-3 rounded-xl border border-sky-900/50 shadow-sm w-full">
            <label class="block text-[9px] font-bold text-sky-300 uppercase tracking-widest mb-2">📄 ファイル保存レコード</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn" class="bg-[#02111d] border border-cyan-400 text-cyan-300 text-[10px] py-2 rounded font-bold hover:bg-[#0b3558] transition flex items-center justify-center gap-1"><span>📥 設定をJSONで保存</span></button>
                <button id="importJsonBtn" class="bg-[#02111d] border border-emerald-400 text-emerald-300 text-[10px] py-2 rounded font-bold hover:bg-[#0b3558] transition flex items-center justify-center gap-1"><span>📤 設定を読み込む</span></button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">
            </div>
        </div>

        <div id="captureArea" class="preview-area">
            <div class="card" id="productCard">
                <div class="caustics"></div>

                <div class="ocean-header">
                    <span class="depth-tag" id="displayMfgCode">DEPTH: 40m // ABYSS</span>
                    <span class="aqua-badge" id="displayBrandName">OCEANIC</span>
                </div>

                <div class="ocean-title-box">
                    <div class="ocean-title ck-fit" id="displayCodeName">AroundForty</div>
                    <div class="ocean-sub ck-fit" id="displaySlogan">recorded at 天下一キーボードわいわい会 vol.12</div>
                </div>

                <div class="ocean-grid">
                    <div>
                        <span class="ocean-item-label" id="displayLabel1">SWITCH</span>
                        <span class="ocean-item-val ck-fit" id="displayVal1">Cherry MX Red</span>
                    </div>
                    <div>
                        <span class="ocean-item-label" id="displayLabel2">KEYCAPS</span>
                        <span class="ocean-item-val ck-fit" id="displayVal2">PBT Double-shot</span>
                    </div>
                    <div>
                        <span class="ocean-item-label" id="displayLabel3">SPEC</span>
                        <span class="ocean-item-val ck-fit" id="displayVal3">40% Split Ergonomic</span>
                    </div>
                    <div>
                        <span class="ocean-item-label" id="displayLabel4">DIVER</span>
                        <span class="ocean-item-val ck-fit" id="displayVal4">@user</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-panel ck-panel">
            <label class="ck-label" style="margin-bottom:1rem">🎨 カードを編集 [OCEAN]</label>
            <div class="ck-field">
                <label class="ck-label" for="mfgCodeInput">水深・タグ / Depth Tag</label>
                <input type="text" id="mfgCodeInput" class="ck-input" value="DEPTH: 40m // ABYSS">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="brandNameInput">バッジ / Badge</label>
                <input type="text" id="brandNameInput" class="ck-input" value="OCEANIC">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="codeNameInput">キーボード名 / Title</label>
                <input type="text" id="codeNameInput" class="ck-input" value="AroundForty">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="sloganInput">サブタイトル / Slogan</label>
                <input type="text" id="sloganInput" class="ck-input" value="recorded at 天下一キーボードわいわい会 vol.12">
            </div>

            <div class="ck-field">
                <div class="ck-section-head"><label class="ck-label">アクアカラー / Ocean Cyan</label></div>
                <div class="color-swatch-grid" id="swatchGrid"></div>
            </div>

            <div class="ck-field">
                <label class="ck-label">項目1 (ラベル / 内容)</label>
                <input type="text" id="label1Input" class="ck-input" value="SWITCH" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val1Input" class="ck-input" value="Cherry MX Red">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目2 (ラベル / 内容)</label>
                <input type="text" id="label2Input" class="ck-input" value="KEYCAPS" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val2Input" class="ck-input" value="PBT Double-shot">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目3 (ラベル / 内容)</label>
                <input type="text" id="label3Input" class="ck-input" value="SPEC" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val3Input" class="ck-input" value="40% Split Ergonomic">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目4 (ラベル / 内容)</label>
                <input type="text" id="label4Input" class="ck-input" value="DIVER" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val4Input" class="ck-input" value="@user">
            </div>

            <div style="margin-top:1.5rem">
                <button id="btnExport" class="ck-btn ck-btn-primary" style="width:100%">高画質PNGで保存</button>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'OCEAN',
            exportBg: '#031b2e',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' },
                { input: 'brandNameInput', target: 'displayBrandName', key: 'brandName' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'label1Input', target: 'displayLabel1', key: 'label1' },
                { input: 'val1Input', target: 'displayVal1', key: 'val1' },
                { input: 'label2Input', target: 'displayLabel2', key: 'label2' },
                { input: 'val2Input', target: 'displayVal2', key: 'val2' },
                { input: 'label3Input', target: 'displayLabel3', key: 'label3' },
                { input: 'val3Input', target: 'displayVal3', key: 'val3' },
                { input: 'label4Input', target: 'displayLabel4', key: 'label4' },
                { input: 'val4Input', target: 'displayVal4', key: 'val4' }
            ],
            accent: {
                cssVar: '--accent-color',
                default: '#00f2fe',
                swatches: [
                    { hex: '#00f2fe', label: 'TROPICAL CYAN' }, { hex: '#38bdf8', label: 'SKY AQUA' },
                    { hex: '#818cf8', label: 'DEEP INDIGO' }, { hex: '#34d399', label: 'SEA EMERALD' },
                    { hex: '#f43f5e', label: 'CORAL REEF' }
                ]
            }
        });
    </script>
</body>

</html>
