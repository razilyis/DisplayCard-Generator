<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard - DQ Pixel Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- レトロゲーム風の日本語フォントを一括ロード -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Kaisei+Opti&family=Mochiy+Pop+One&family=Reggae+One&family=RocknRoll+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --text-color: #FFFFFF;
            --bg-color: #000000;
            --window-border: #FFFFFF;
            --main-font: 'DotGothic16', sans-serif;
        }

        body {
            --ui-bg: #202020;
            --ui-panel: #111111;
            --ui-panel-2: #000000;
            --ui-border: #4b5563;
            --ui-text: #eeeeee;
            --ui-muted: #9ca3af;
            --ui-accent: #ffffff;
            --ui-accent-text: #000000;
            color: #eee;
            font-family: var(--main-font);
        }

        /* RPG Status Screen Style */
        .card {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 3mm;
            /* 二重線の白枠は「ボウケンノショ」ウィンドウそのものなので border のまま残す */
            border: 4px double white;
            border-radius: 6px;
            font-family: var(--main-font);
            -webkit-font-smoothing: none;
            image-rendering: pixelated;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* ステータスヘッダー */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1mm;
            border-bottom: 2px solid white;
            padding-bottom: 1mm;
            flex-shrink: 0;
        }

        /* ステータスコンテンツ（左右分割） */
        .status-content {
            display: flex;
            flex-grow: 0;
            gap: 2mm;
            margin-bottom: 1mm;
        }

        .status-body {
            flex: 2;
            /* 左側のテキストエリアを広めに */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 0.5mm;
            font-size: 10px;
        }

        /* 画像エリア */
        .status-image-area {
            flex: 1;
            border: 2px solid #666;
            background-color: #111;
            position: relative;
            overflow: hidden;
            min-width: 18mm;
            height: 22mm;
            /* 高さを固定してレイアウト崩れを防ぐ */
            border-radius: 2px;
        }

        .status-row {
            display: flex;
            align-items: baseline;
        }

        .label {
            color: #3bf6ff;
            margin-right: 0.5em;
            min-width: 5em;
            text-align: justify;
            text-align-last: justify;
            line-height: 1.4;
        }

        .equip-mark {
            color: #ffcc00;
            margin-right: 0.2em;
            font-weight: bold;
        }

        .value {
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            padding-bottom: 1px;
        }

        /* Description Window */
        .msg-window {
            border: 2px solid white;
            border-radius: 4px;
            padding: 1.5mm 2mm;
            flex-grow: 1;
            /* 残りのスペースを埋める */
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #displaySlogan {
            --fit-lh: 1.5;
        }

        /* Cursor Animation */
        .cursor {
            display: inline-block;
            width: 0;
            height: 0;
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
            border-left: 5px solid white;
            margin-right: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Editor Panel */
        .editor-panel {
            background: #2d2d2d;
            border-radius: 4px;
            padding: 1.5rem;
            border: 1px solid #444;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Inputs */
        input[type="text"],
        textarea,
        select {
            background-color: #000;
            border: 1px solid #fff;
            color: #fff;
            font-family: var(--main-font);
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: #3bf6ff;
            outline: none;
        }

        /* Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #3bf6ff;
            border-radius: 0;
            cursor: pointer;
            border: 2px solid #fff;
        }

        /* Image Upload Area */
        .image-upload-zone {
            border: 2px dashed #666;
            padding: 0.5rem;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: #111;
            color: #888;
            font-size: 10px;
        }

        .image-upload-zone:hover {
            border-color: #fff;
            color: #fff;
        }

        /* Buttons */
        .btn-retro {
            background-color: #000;
            border: 2px solid #fff;
            color: #fff;
            font-family: var(--main-font);
            border-radius: 4px;
            transition: all 0.1s;
        }

        .btn-retro:hover {
            background-color: #fff;
            color: #000;
        }

        #exportStatus {
            position: fixed;
            bottom: 20px;
            background: #000;
            color: #fff;
            padding: 8px 16px;
            border: 2px solid #fff;
            border-radius: 4px;
            font-family: var(--main-font);
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <div class="w-full max-w-6xl flex justify-between items-center mb-8 px-4 font-mono">
        <a href="index.html" class="text-xs font-bold text-gray-500 hover:text-white transition">&lt; メニューニ モドル</a>
        <h1 class="text-xl font-bold text-white tracking-wider">つよさ ヲ みる</h1>
        <div class="w-16"></div>
    </div>

    <div class="tool-container space-y-4">

        <!-- File Save Section -->
        <div class="file-system-panel bg-[#2d2d2d] p-3 border border-[#444] w-full rounded">
            <label class="block text-[10px] font-bold text-gray-400 mb-2">
                キロク コマンド
            </label>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn" class="btn-retro text-xs py-2 flex items-center justify-center gap-1">
                    <span>セーブ(JSON)</span>
                </button>
                <button id="importJsonBtn" class="btn-retro text-xs py-2 flex items-center justify-center gap-1">
                    <span>ロード(JSON)</span>
                </button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">
            </div>
        </div>

        <!-- Card Preview Area -->
        <div id="captureArea" class="preview-area">
            <div class="card" id="productCard">

                <!-- Status Header -->
                <div class="status-header">
                    <div class="flex items-center">
                        <span class="cursor"></span>
                        <span class="text-[16px] font-bold tracking-widest text-yellow-400"
                            id="displayBrandName">AroundForty</span>
                    </div>
                    <div class="text-[12px]">
                        <span id="displayLevelLabel">Lv.</span> <span id="displayLevel" class="font-bold">40</span>
                    </div>
                </div>

                <!-- Status Body (Split Layout) -->
                <div class="status-content">
                    <!-- Left: Stats -->
                    <div class="status-body">
                        <div class="status-row">
                            <span class="label" id="displayCodeNameLabel">しょくぎょう</span>
                            <span class="value ck-fit" id="displayCodeName">AroundFortyRB</span>
                        </div>
                        <div class="status-row">
                            <span class="label" id="displayMfgCodeLabel">せいぞうNo</span>
                            <span class="value ck-fit" id="displayMfgCode">02AFRB</span>
                        </div>
                        <div class="status-row">
                            <span class="label" id="displayOwnerLabel">オーナー</span>
                            <span class="value ck-fit" id="displayOwner">勇者ユーザー</span>
                        </div>

                        <!-- Spacing -->
                        <div class="h-0.5"></div>

                        <!-- Equipment -->
                        <div class="status-row">
                            <span class="equip-mark">E</span>
                            <span class="label" style="min-width: 4em;" id="displayKeySwitchLabel">ぶき</span>
                            <span class="value ck-fit" id="displayKeySwitch">赤軸スイッチ</span>
                        </div>
                        <div class="status-row">
                            <span class="equip-mark">E</span>
                            <span class="label" style="min-width: 4em;" id="displayKeyCapsLabel">ぼうぐ</span>
                            <span class="value ck-fit" id="displayKeyCaps">PBTキーキャップ</span>
                        </div>
                    </div>

                    <!-- Right: Character Image -->
                    <div class="status-image-area flex items-center justify-center">
                        <img id="displayImage" src="" class="absolute w-full h-full object-cover"
                            style="display: none; image-rendering: pixelated;">
                        <span id="imagePlaceholder"
                            class="text-[8px] text-gray-600 text-center leading-tight">NO<br>IMAGE</span>
                    </div>
                </div>

                <!-- Message Window (Flex grow to fill space) -->
                <div class="msg-window">
                    <p id="displaySlogan" class="ck-fit ck-fit-box whitespace-pre-wrap text-[10px]"
                        data-fit-min="0.5" style="max-height:100%">大人のための道具。
                        精密に設計されたキーボードだ。</p>
                    <span class="animate-pulse absolute bottom-1 right-2 text-[10px]">▼</span>
                </div>

            </div>
        </div>

        <!-- Editor Panel -->
        <div class="editor-panel">
            <div class="flex justify-between items-center mb-4 border-b border-[#444] pb-2">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">パラメータ ヘンシュウ</h2>
            </div>

            <div class="space-y-5">
                <!-- Font Selection -->
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">フォント (FONT)</label>
                    <select id="fontSelect"
                        class="w-full text-xs p-2 bg-[#000] text-white border border-gray-600 h-8 cursor-pointer">
                        <option value="'DotGothic16', sans-serif">DotGothic16 (ドットゴシック)</option>
                        <option value="'Dela Gothic One', cursive">Dela Gothic (ゴツイ ゴシック)</option>
                        <option value="'Reggae One', cursive">Reggae One (カクカク レトロ)</option>
                        <option value="'RocknRoll One', sans-serif">RocknRoll (ポップ ロック)</option>
                        <option value="'Mochiy Pop One', sans-serif">Mochiy Pop (マルッコイ)</option>
                        <option value="'Kaisei Opti', serif">Kaisei Opti (PC98フウ)</option>
                    </select>
                </div>

                <!-- Image Upload -->
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">ガゾウ (Image)</label>
                    <label class="image-upload-zone block mb-2">
                        <span>[ファイル ヲ センタク]</span>
                        <input type="file" id="imageUpload" accept="image/*" class="hidden">
                    </label>
                    <button id="imageClear" class="w-full mb-2 text-[9px] text-gray-500 hover:text-red-400 py-1">[ガゾウ
                        ヲ ケス]</button>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[8px] text-gray-500 mb-0.5">ヨコ (X)</label>
                            <input type="range" id="imgPosX" min="-100" max="100" value="0" class="w-full">
                        </div>
                        <div>
                            <label class="block text-[8px] text-gray-500 mb-0.5">タテ (Y)</label>
                            <input type="range" id="imgPosY" min="-100" max="100" value="0" class="w-full">
                        </div>
                        <div>
                            <label class="block text-[8px] text-gray-500 mb-0.5">オオキサ</label>
                            <input type="range" id="imgScale" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full">
                        </div>
                    </div>
                </div>

                <!-- Inputs -->
                <div class="space-y-3">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="col-span-2">
                            <label class="block text-[10px] text-gray-400 mb-1">ナマエ (Brand)</label>
                            <input type="text" id="brandNameInput" value="AroundForty" class="w-full">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-1">レベル (Label/Val)</label>
                            <div class="flex gap-1">
                                <input type="text" id="levelLabelInput" value="Lv." class="w-1/2 text-center px-0">
                                <input type="text" id="levelInput" value="40" class="w-1/2 text-center px-0">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">セツメイ (Slogan)</label>
                        <textarea id="sloganInput" class="w-full h-16 mb-2">大人のための道具。
精密に設計されたキーボードだ。</textarea>

                        <!-- Font Size Slider -->
                        <div class="flex justify-between items-center mb-1 px-1">
                            <label class="text-[8px] text-gray-400">モジサイズ</label>
                            <span id="sloganSizeDisplay" class="text-[8px] text-[#3bf6ff]">10px</span>
                        </div>
                        <input type="range" id="sloganSizeInput" min="6" max="16" value="10" step="1" class="w-full">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[8px] text-gray-400 mb-1">ラベル 1</label>
                            <input type="text" id="codeNameLabelInput" value="しょくぎょう"
                                class="w-full text-[10px] bg-[#222] border-gray-600 mb-1">
                            <input type="text" id="codeNameInput" value="AroundFortyRB" class="w-full">
                        </div>
                        <div>
                            <label class="block text-[8px] text-gray-400 mb-1">ラベル 2</label>
                            <input type="text" id="mfgCodeLabelInput" value="せいぞうNo"
                                class="w-full text-[10px] bg-[#222] border-gray-600 mb-1">
                            <input type="text" id="mfgCodeInput" value="02AFRB" class="w-full">
                        </div>
                        <div>
                            <label class="block text-[8px] text-gray-400 mb-1">ラベル 3 (Owner)</label>
                            <input type="text" id="ownerLabelInput" value="オーナー"
                                class="w-full text-[10px] bg-[#222] border-gray-600 mb-1">
                            <input type="text" id="ownerInput" value="勇者ユーザー" class="w-full">
                        </div>
                        <div><!-- Spacer --></div>
                        <div>
                            <label class="block text-[8px] text-gray-400 mb-1">そうび 1 (Switch)</label>
                            <input type="text" id="keySwitchLabelInput" value="ぶき"
                                class="w-full text-[10px] bg-[#222] border-gray-600 mb-1">
                            <input type="text" id="keySwitchInput" value="赤軸スイッチ" class="w-full">
                        </div>
                        <div>
                            <label class="block text-[8px] text-gray-400 mb-1">そうび 2 (Caps)</label>
                            <input type="text" id="keyCapsLabelInput" value="ぼうぐ"
                                class="w-full text-[10px] bg-[#222] border-gray-600 mb-1">
                            <input type="text" id="keyCapsInput" value="PBTキーキャップ" class="w-full">
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-6 border-t border-[#444] mt-6">
                <button id="btnExport"
                    class="w-full py-3 px-4 btn-retro text-sm flex items-center justify-center gap-2">
                    <span>ガゾウ ヲ カキダス</span>
                </button>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'RPG',
            exportBg: '#000000',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'brandNameInput', target: 'displayBrandName', key: 'brandName' },
                { input: 'levelLabelInput', target: 'displayLevelLabel', key: 'levelLabel' },
                { input: 'levelInput', target: 'displayLevel', key: 'level' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'codeNameLabelInput', target: 'displayCodeNameLabel', key: 'codeNameLabel' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'mfgCodeLabelInput', target: 'displayMfgCodeLabel', key: 'mfgCodeLabel' },
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' },
                { input: 'ownerLabelInput', target: 'displayOwnerLabel', key: 'ownerLabel' },
                { input: 'ownerInput', target: 'displayOwner', key: 'owner' },
                { input: 'keySwitchLabelInput', target: 'displayKeySwitchLabel', key: 'keySwitchLabel' },
                { input: 'keySwitchInput', target: 'displayKeySwitch', key: 'keySwitch' },
                { input: 'keyCapsLabelInput', target: 'displayKeyCapsLabel', key: 'keyCapsLabel' },
                { input: 'keyCapsInput', target: 'displayKeyCaps', key: 'keyCaps' }
            ],
            ranges: [
                { input: 'sloganSizeInput', display: 'sloganSizeDisplay', target: 'displaySlogan', style: 'fontSize', unit: 'pt', key: 'sloganSize' }
            ],
            selects: [
                { input: 'fontSelect', cssVar: '--main-font', key: 'font' }
            ],
            image: {
                input: 'imageUpload', target: 'displayImage', placeholder: 'imagePlaceholder',
                clear: 'imageClear',
                posX: 'imgPosX', posY: 'imgPosY', scale: 'imgScale',
                key: 'image'
            }
        });
    </script>
</body>

</html>
