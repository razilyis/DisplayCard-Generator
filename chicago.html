<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard Generator [CHICAGO]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=VT323&family=DotGothic16&family=Press+Start+2P&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #000080;
            --bg-color: #c0c0c0;
            --main-font: 'DotGothic16', sans-serif;
        }

        body {
            --ui-bg: #262626;
            --ui-panel: #333333;
            --ui-panel-2: #1e1e1e;
            --ui-border: #555555;
            --ui-text: #e0e0e0;
            --ui-muted: #aaaaaa;
            --ui-accent: #008080;
            --ui-accent-text: #fff;
        }

        .card {
            background-color: var(--bg-color);
            color: #000000;
            padding: 2mm;
            font-family: var(--main-font);
            box-shadow: inset 1px 1px 0px #fff, inset -1px -1px 0px #808080, 0 15px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-image: 
                radial-gradient(#808080 15%, transparent 16%),
                radial-gradient(#808080 15%, transparent 16%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
        }

        /* 90s GUI ウィンドウ */
        .gui-window {
            background: #c0c0c0;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px #000, inset 1px 1px 0px #fff;
            padding: 1.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .gui-titlebar {
            background: var(--accent-color);
            color: #ffffff;
            padding: 1mm 2mm;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 8pt;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .gui-close-btn {
            width: 10px;
            height: 10px;
            background: #c0c0c0;
            border: 1px solid #000;
            box-shadow: inset 1px 1px 0px #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6px;
            color: #000;
            line-height: 1;
        }

        .gui-body {
            background: #ffffff;
            border: 1px solid #808080;
            box-shadow: inset 1px 1px 0px #000;
            padding: 2mm 3mm;
            margin-top: 1.5mm;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .gui-app-name {
            font-size: 14pt;
            font-weight: 900;
            color: #000000;
            line-height: 1.1;
        }

        .gui-sub {
            font-size: 7.5pt;
            color: #404040;
            margin-top: 0.5mm;
        }

        .gui-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5mm 3mm;
            margin-top: 2mm;
            border-top: 1px solid #c0c0c0;
            padding-top: 1.5mm;
        }

        .gui-item-label {
            font-size: 6pt;
            color: #606060;
            display: block;
        }

        .gui-item-val {
            font-size: 8pt;
            font-weight: 700;
            color: #000000;
        }

        .gui-btn-bar {
            display: flex;
            justify-content: flex-end;
            gap: 2mm;
            margin-top: 1.5mm;
        }

        .gui-btn {
            background: #c0c0c0;
            border: 1px solid #000;
            box-shadow: inset 1px 1px 0px #fff, 1px 1px 0px #000;
            padding: 1px 8px;
            font-size: 6.5pt;
            font-weight: 700;
        }

        .dynamic-text { color: var(--accent-color) !important; }
        .dynamic-bg { background-color: var(--accent-color) !important; }
        .dynamic-border { border-color: var(--accent-color) !important; }
    </style>
</head>

<body>
    <div class="w-full max-w-6xl flex justify-between items-center mb-6 px-4">
        <a href="index.html" class="text-xs font-bold text-teal-400 hover:text-white transition">← MENU</a>
        <h1 class="text-lg font-black text-teal-300 tracking-tight uppercase">Chicago 90s GUI Generator</h1>
        <div class="w-16"></div>
    </div>

    <div class="tool-container">
        <div class="file-system-panel bg-[#333333] p-3 rounded-xl border border-gray-600 shadow-sm w-full">
            <label class="block text-[9px] font-bold text-teal-300 uppercase tracking-widest mb-2">📄 ファイル保存レコード</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn" class="bg-[#1e1e1e] border border-teal-500 text-teal-300 text-[10px] py-2 rounded font-bold hover:bg-[#444] transition flex items-center justify-center gap-1"><span>📥 設定をJSONで保存</span></button>
                <button id="importJsonBtn" class="bg-[#1e1e1e] border border-blue-400 text-blue-300 text-[10px] py-2 rounded font-bold hover:bg-[#444] transition flex items-center justify-center gap-1"><span>📤 設定を読み込む</span></button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">
            </div>
        </div>

        <div id="captureArea" class="preview-area">
            <div class="card" id="productCard">
                <div class="gui-window">
                    <div class="gui-titlebar">
                        <span class="ck-fit" id="displayMfgCode">Keyboard.app // SYSTEM7</span>
                        <div class="gui-close-btn">■</div>
                    </div>

                    <div class="gui-body">
                        <div>
                            <div class="gui-app-name ck-fit" id="displayCodeName">AroundForty</div>
                            <div class="gui-sub ck-fit" id="displaySlogan">recorded at 天下一キーボードわいわい会 vol.12</div>
                        </div>

                        <div class="gui-grid">
                            <div>
                                <span class="gui-item-label" id="displayLabel1">SWITCH</span>
                                <span class="gui-item-val ck-fit" id="displayVal1">Cherry MX Red</span>
                            </div>
                            <div>
                                <span class="gui-item-label" id="displayLabel2">KEYCAPS</span>
                                <span class="gui-item-val ck-fit" id="displayVal2">PBT Double-shot</span>
                            </div>
                            <div>
                                <span class="gui-item-label" id="displayLabel3">LAYOUT</span>
                                <span class="gui-item-val ck-fit" id="displayVal3">40% Split Ergonomic</span>
                            </div>
                            <div>
                                <span class="gui-item-label" id="displayLabel4">USER</span>
                                <span class="gui-item-val ck-fit" id="displayVal4">@user</span>
                            </div>
                        </div>

                        <div class="gui-btn-bar">
                            <span class="gui-btn" id="displayBrandName">OK</span>
                            <span class="gui-btn">CANCEL</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-panel ck-panel">
            <label class="ck-label" style="margin-bottom:1rem">🎨 カードを編集 [CHICAGO]</label>
            <div class="ck-field">
                <label class="ck-label" for="mfgCodeInput">タイトルバー / Window Title</label>
                <input type="text" id="mfgCodeInput" class="ck-input" value="Keyboard.app // SYSTEM7">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="brandNameInput">ボタンラベル / OK Button</label>
                <input type="text" id="brandNameInput" class="ck-input" value="OK">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="codeNameInput">キーボード名 / Title</label>
                <input type="text" id="codeNameInput" class="ck-input" value="AroundForty">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="sloganInput">サブタイトル / Slogan</label>
                <input type="text" id="sloganInput" class="ck-input" value="recorded at 天下一キーボードわいわい会 vol.12">
            </div>

            <div class="ck-field">
                <div class="ck-section-head"><label class="ck-label">タイトルバー色 / Titlebar Color</label></div>
                <div class="color-swatch-grid" id="swatchGrid"></div>
            </div>

            <div class="ck-field">
                <label class="ck-label">項目1 (ラベル / 内容)</label>
                <input type="text" id="label1Input" class="ck-input" value="SWITCH" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val1Input" class="ck-input" value="Cherry MX Red">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目2 (ラベル / 内容)</label>
                <input type="text" id="label2Input" class="ck-input" value="KEYCAPS" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val2Input" class="ck-input" value="PBT Double-shot">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目3 (ラベル / 内容)</label>
                <input type="text" id="label3Input" class="ck-input" value="LAYOUT" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val3Input" class="ck-input" value="40% Split Ergonomic">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目4 (ラベル / 内容)</label>
                <input type="text" id="label4Input" class="ck-input" value="USER" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val4Input" class="ck-input" value="@user">
            </div>

            <div style="margin-top:1.5rem">
                <button id="btnExport" class="ck-btn ck-btn-primary" style="width:100%">高画質PNGで保存</button>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'CHICAGO',
            exportBg: '#c0c0c0',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' },
                { input: 'brandNameInput', target: 'displayBrandName', key: 'brandName' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'label1Input', target: 'displayLabel1', key: 'label1' },
                { input: 'val1Input', target: 'displayVal1', key: 'val1' },
                { input: 'label2Input', target: 'displayLabel2', key: 'label2' },
                { input: 'val2Input', target: 'displayVal2', key: 'val2' },
                { input: 'label3Input', target: 'displayLabel3', key: 'label3' },
                { input: 'val3Input', target: 'displayVal3', key: 'val3' },
                { input: 'label4Input', target: 'displayLabel4', key: 'label4' },
                { input: 'val4Input', target: 'displayVal4', key: 'val4' }
            ],
            accent: {
                cssVar: '--accent-color',
                default: '#000080',
                swatches: [
                    { hex: '#000080', label: 'NAVY' }, { hex: '#008080', label: 'TEAL' },
                    { hex: '#800000', label: 'MAROON' }, { hex: '#808000', label: 'OLIVE' },
                    { hex: '#800080', label: 'PURPLE' }, { hex: '#000000', label: 'BLACK' }
                ]
            }
        });
    </script>
</body>

</html>
