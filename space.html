<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard Generator [SPACE]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #8b5cf6;
            --bg-color: #030712;
            --main-font: 'Orbitron', sans-serif;
        }

        body {
            --ui-bg: #030712;
            --ui-panel: #111827;
            --ui-panel-2: #030712;
            --ui-border: #1f2937;
            --ui-text: #f3f4f6;
            --ui-muted: #6b7280;
            --ui-accent: var(--accent-color);
            --ui-accent-text: #fff;
        }

        .card {
            background-color: var(--bg-color);
            color: #f3f4f6;
            padding: 6mm 7mm;
            font-family: var(--main-font);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.35) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.25) 0%, transparent 45%);
        }

        /* 星々（パーティクル風背景） */
        .stars {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 290px 150px, rgba(139, 92, 246, 0.9), rgba(0,0,0,0));
            opacity: 0.6;
            pointer-events: none;
        }

        .space-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 2mm;
            position: relative;
            z-index: 2;
        }

        .mission-id {
            font-family: 'Share Tech Mono', monospace;
            font-size: 7.5pt;
            letter-spacing: 0.15em;
            color: var(--accent-color);
        }

        .orbit-badge {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 6pt;
            letter-spacing: 0.1em;
        }

        .space-title-box {
            margin: 2mm 0;
            position: relative;
            z-index: 2;
        }

        .space-title {
            font-size: 16pt;
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-shadow: 0 0 12px var(--accent-color);
            line-height: 1.1;
        }

        .space-sub {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 7.5pt;
            color: #9ca3af;
            margin-top: 1mm;
        }

        .space-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5mm 4mm;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            padding: 2.5mm 3.5mm;
            border-radius: 6px;
            position: relative;
            z-index: 2;
        }

        .space-item-label {
            font-size: 5.5pt;
            color: #6b7280;
            display: block;
            letter-spacing: 0.1em;
            font-family: 'Share Tech Mono', monospace;
        }

        .space-item-val {
            font-size: 8pt;
            font-weight: 700;
            color: #f3f4f6;
            font-family: 'Space Grotesk', sans-serif;
        }

        .dynamic-text { color: var(--accent-color) !important; }
        .dynamic-bg { background-color: var(--accent-color) !important; }
        .dynamic-border { border-color: var(--accent-color) !important; }
    </style>
</head>

<body>
    <div class="app-wrap">
        <div class="preview-area">
            <div class="card" id="productCard">
                <div class="stars"></div>

                <div class="space-header">
                    <span class="mission-id" id="displayMfgCode">MISSION // DEEP-SPACE</span>
                    <span class="orbit-badge" id="displayBrandName">COSMIC</span>
                </div>

                <div class="space-title-box">
                    <div class="space-title ck-fit" id="displayCodeName">AroundForty</div>
                    <div class="space-sub ck-fit" id="displaySlogan">recorded at 天下一キーボードわいわい会 vol.12</div>
                </div>

                <div class="space-grid">
                    <div>
                        <span class="space-item-label" id="displayLabel1">PROPULSION / SWITCH</span>
                        <span class="space-item-val ck-fit" id="displayVal1">Cherry MX Red</span>
                    </div>
                    <div>
                        <span class="space-item-label" id="displayLabel2">HULL / KEYCAPS</span>
                        <span class="space-item-val ck-fit" id="displayVal2">PBT Double-shot</span>
                    </div>
                    <div>
                        <span class="space-item-label" id="displayLabel3">ORBIT / SPEC</span>
                        <span class="space-item-val ck-fit" id="displayVal3">40% Split Ergonomic</span>
                    </div>
                    <div>
                        <span class="space-item-label" id="displayLabel4">COMMANDER</span>
                        <span class="space-item-val ck-fit" id="displayVal4">@user</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-panel ck-panel">
            <label class="ck-label" style="margin-bottom:1rem">🎨 カードを編集 [SPACE]</label>
            <div class="ck-field">
                <label class="ck-label" for="mfgCodeInput">ミッションID / Mission ID</label>
                <input type="text" id="mfgCodeInput" class="ck-input" value="MISSION // DEEP-SPACE">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="brandNameInput">バッジ / Badge</label>
                <input type="text" id="brandNameInput" class="ck-input" value="COSMIC">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="codeNameInput">キーボード名 / Title</label>
                <input type="text" id="codeNameInput" class="ck-input" value="AroundForty">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="sloganInput">サブタイトル / Slogan</label>
                <input type="text" id="sloganInput" class="ck-input" value="recorded at 天下一キーボードわいわい会 vol.12">
            </div>

            <div class="ck-field">
                <div class="ck-section-head"><label class="ck-label">ネブラカラー / Nebula Color</label></div>
                <div class="color-swatch-grid" id="swatchGrid"></div>
            </div>

            <div class="ck-field">
                <label class="ck-label">項目1 (ラベル / 内容)</label>
                <input type="text" id="label1Input" class="ck-input" value="PROPULSION / SWITCH" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val1Input" class="ck-input" value="Cherry MX Red">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目2 (ラベル / 内容)</label>
                <input type="text" id="label2Input" class="ck-input" value="HULL / KEYCAPS" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val2Input" class="ck-input" value="PBT Double-shot">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目3 (ラベル / 内容)</label>
                <input type="text" id="label3Input" class="ck-input" value="ORBIT / SPEC" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val3Input" class="ck-input" value="40% Split Ergonomic">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目4 (ラベル / 内容)</label>
                <input type="text" id="label4Input" class="ck-input" value="COMMANDER" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val4Input" class="ck-input" value="@user">
            </div>

            <div style="margin-top:1.5rem">
                <button id="btnExport" class="ck-btn ck-btn-primary" style="width:100%">高画質PNGで保存</button>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'SPACE',
            exportBg: '#030712',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' },
                { input: 'brandNameInput', target: 'displayBrandName', key: 'brandName' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'label1Input', target: 'displayLabel1', key: 'label1' },
                { input: 'val1Input', target: 'displayVal1', key: 'val1' },
                { input: 'label2Input', target: 'displayLabel2', key: 'label2' },
                { input: 'val2Input', target: 'displayVal2', key: 'val2' },
                { input: 'label3Input', target: 'displayLabel3', key: 'label3' },
                { input: 'val3Input', target: 'displayVal3', key: 'val3' },
                { input: 'label4Input', target: 'displayLabel4', key: 'label4' },
                { input: 'val4Input', target: 'displayVal4', key: 'val4' }
            ],
            accent: {
                cssVar: '--accent-color',
                default: '#8b5cf6',
                swatches: [
                    { hex: '#8b5cf6', label: 'NEBULA VIOLET' }, { hex: '#06b6d4', label: 'CYAN STAR' },
                    { hex: '#ec4899', label: 'SUPERNOVA' }, { hex: '#3b82f6', label: 'DEEP BLUE' },
                    { hex: '#10b981', label: 'AURORA' }
                ]
            }
        });
    </script>
</body>

</html>
