<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard - Swiss Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;700;900&family=Lato:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #E60012;
            --main-font: 'Inter', sans-serif;
        }

        .card {
            background-color: #ffffff;
            color: #111111;
            justify-content: space-between;
            padding: 7mm;
            font-family: var(--main-font);
            /* 外周ラインと影は box-shadow で描く。border と違いレイアウトに影響しないので
               書き出し時に外してもカード内の要素が 1px も動かない */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), 0 0 0 1px #eeeeee;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .label-text {
            font-size: 5.5pt;
            letter-spacing: 0.1em;
            color: #888888;
            text-transform: uppercase;
            font-weight: 700;
            line-height: 1.2;
        }

        .value-text {
            font-size: 8.5pt;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .wm-text {
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            font-size: 120pt;
        }

        .dynamic-bg {
            background-color: var(--accent-color) !important;
        }

        .dynamic-text {
            color: var(--accent-color) !important;
        }

        .accent-grey {
            background-color: #4b5563;
        }

        .editor-panel {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid #e5e7eb;
        }

        input[type="text"],
        textarea,
        select {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            color: #111;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: #111;
            outline: none;
            background-color: #fff;
        }
    </style>
</head>

<body>
    <div class="w-full max-w-6xl flex justify-between items-center mb-6 px-4">
        <a href="index.html" class="text-xs font-bold text-gray-400 hover:text-gray-900 transition">← BACK TO MENU</a>
        <h1 class="text-xl font-black text-gray-900 tracking-tighter uppercase">Swiss Style Generator</h1>
        <div class="w-20"></div>
    </div>

    <div class="tool-container">
        <div class="file-system-panel bg-white p-3 rounded-xl border border-gray-200 shadow-sm w-full">
            <label class="block text-[9px] font-bold text-green-600 uppercase tracking-widest mb-2">📄
                ファイル保存レコード</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn"
                    class="bg-white border border-green-500 text-green-600 text-[10px] py-2 rounded font-bold hover:bg-green-50 transition flex items-center justify-center gap-1 shadow-sm"><span>📥
                        設定をJSONで保存</span></button>
                <button id="importJsonBtn"
                    class="bg-white border border-blue-500 text-blue-600 text-[10px] py-2 rounded font-bold hover:bg-blue-50 transition flex items-center justify-center gap-1 shadow-sm"><span>📤
                        設定を読み込む</span></button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">
            </div>
        </div>

        <div id="captureArea" class="preview-area">
            <div class="card" id="productCard">
                <div class="absolute top-0 left-0 w-1.5 h-full dynamic-bg z-20"></div>

                <div class="ck-watermark" id="displayBgTextContainer" style="opacity: 0.08;">
                    <span class="wm-text" id="displayBgText">AF</span>
                </div>

                <div class="z-10 flex justify-between items-start mb-2 gap-3">
                    <div class="min-w-0 flex-1">
                        <h1 class="ck-fit ck-fit-wrap text-[20pt] font-[900] tracking-tighter uppercase" data-fit-solo="0.45"
                            style="--fit-lines:2;--fit-lh:1.12">
                            <span id="displayBrandName">AroundForty</span><span class="dynamic-text">.</span>
                        </h1>
                    </div>
                    <div class="text-right flex flex-col items-end shrink-0 max-w-[34mm] min-w-0">
                        <div class="flex gap-1 opacity-90 mb-2">
                            <div class="w-6 h-3.5 border border-black flex items-end justify-end p-0.5">
                                <div class="w-[5px] h-[5px] dynamic-bg"></div>
                            </div>
                            <div class="w-6 h-3.5 border border-black flex items-end justify-between p-0.5">
                                <div class="w-[5px] h-[5px] dynamic-bg"></div>
                                <div class="w-[5px] h-[5px] accent-grey"></div>
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <span class="label-text" id="displayCodeNameLabel">Code Name</span>
                            <span class="value-text ck-fit ck-fit-wrap" style="--fit-lines:3" id="displayCodeName">AroundFortyRB</span>
                        </div>
                    </div>
                </div>

                <div class="flex-grow flex flex-col justify-center relative z-10">
                    <div class="w-full h-[0.5px] bg-gray-100 mb-2"></div>
                    <div id="displaySlogan"
                        class="ck-fit ck-fit-wrap text-[8pt] italic text-gray-400 font-medium max-w-[85%]"
                        style="--fit-lines:3">
                        DESIGNED FOR THE MATURE MIND</div>
                </div>

                <div class="z-10 grid grid-cols-3 gap-3 items-end">
                    <div class="flex flex-col min-w-0">
                        <span class="label-text" id="displayKeySwitchLabel">Switch</span>
                        <span class="value-text text-[8.5pt] ck-fit ck-fit-wrap" style="--fit-lines:2"
                            id="displayKeySwitch">CHERRY MX RED</span>
                    </div>
                    <div class="flex flex-col min-w-0">
                        <span class="label-text" id="displayKeyCapsLabel">Keycaps</span>
                        <span class="value-text text-[8.5pt] ck-fit ck-fit-wrap" style="--fit-lines:2"
                            id="displayKeyCaps">PBT DOUBLE-SHOT</span>
                    </div>
                    <div class="flex flex-col text-right min-w-0">
                        <span class="label-text" id="displayMfgCodeLabel">Manufacturing code</span>
                        <span class="value-text mono text-[8.5pt] uppercase ck-fit" id="displayMfgCode">02AFRB</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-panel">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2">🎨 Customize & Edit</h2>
            </div>

            <div class="space-y-4">
                <div>
                    <label
                        class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-2">TYPEFACE</label>
                    <select id="fontSelect"
                        class="w-full text-xs p-2 border border-gray-200 rounded h-8 cursor-pointer bg-gray-50">
                        <option value="'Inter', sans-serif">INTER (DEFAULT)</option>
                        <option value="'Roboto', sans-serif">ROBOTO (NEUTRAL)</option>
                        <option value="'Lato', sans-serif">LATO (FRIENDLY)</option>
                        <option value="'Montserrat', sans-serif">MONTSERRAT (GEOMETRIC)</option>
                        <option value="'Oswald', sans-serif">OSWALD (CONDENSED)</option>
                        <option value="'Playfair Display', serif">PLAYFAIR DISPLAY (ELEGANT)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest">Theme Color
                            (CMYK Swatches)</label>
                        <span id="cmykValueDisplay" class="text-[8px] font-mono text-blue-500 font-bold">C:0 M:100 Y:100
                            K:0</span>
                    </div>
                    <div class="color-swatch-grid" id="swatchGrid"></div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Brand
                            Name</label>
                        <input type="text" id="brandNameInput" value="AroundForty"
                            class="w-full text-xs border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-black uppercase">
                    </div>
                    <div>
                        <label
                            class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Slogan</label>
                        <textarea id="sloganInput"
                            class="w-full text-xs border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-black h-16">DESIGNED FOR THE MATURE MIND</textarea>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg border border-gray-100">
                        <label
                            class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-2">Background
                            Text (Watermark)</label>
                        <input type="text" id="bgTextInput" value="AF"
                            class="w-full text-xs border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-black uppercase mb-3">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Text
                                Size</label>
                            <span id="bgTextSizeDisplay" class="text-[9px] font-bold text-blue-500">120pt</span>
                        </div>
                        <input type="range" id="bgTextSizeInput" min="40" max="250" value="120" class="w-full">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[8px] font-bold text-gray-300 uppercase tracking-widest mb-1">Upper
                                Label</label>
                            <input type="text" id="codeNameLabelInput" value="Code Name"
                                class="w-full text-[10px] border border-gray-100 rounded px-2 py-1 focus:outline-none focus:border-gray-400 mb-1">
                            <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Upper
                                Value</label>
                            <input type="text" id="codeNameInput" value="AroundFortyRB"
                                class="w-full text-xs border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-black">
                        </div>
                        <div>
                            <label class="block text-[8px] font-bold text-gray-300 uppercase tracking-widest mb-1">Lower
                                Label</label>
                            <input type="text" id="mfgCodeLabelInput" value="Manufacturing code"
                                class="w-full text-[10px] border border-gray-100 rounded px-2 py-1 focus:outline-none focus:border-gray-400 mb-1">
                            <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Lower
                                Value</label>
                            <input type="text" id="mfgCodeInput" value="02AFRB"
                                class="w-full text-xs border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-black mono uppercase">
                        </div>
                        <div>
                            <label class="block text-[8px] font-bold text-gray-300 uppercase tracking-widest mb-1">Switch
                                Label</label>
                            <input type="text" id="keySwitchLabelInput" value="Switch"
                                class="w-full text-[10px] border border-gray-100 rounded px-2 py-1 focus:outline-none focus:border-gray-400 mb-1">
                            <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Switch</label>
                            <input type="text" id="keySwitchInput" value="CHERRY MX RED"
                                class="w-full text-xs border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-black">
                        </div>
                        <div>
                            <label class="block text-[8px] font-bold text-gray-300 uppercase tracking-widest mb-1">Keycaps
                                Label</label>
                            <input type="text" id="keyCapsLabelInput" value="Keycaps"
                                class="w-full text-[10px] border border-gray-100 rounded px-2 py-1 focus:outline-none focus:border-gray-400 mb-1">
                            <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Keycaps</label>
                            <input type="text" id="keyCapsInput" value="PBT DOUBLE-SHOT"
                                class="w-full text-xs border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-black">
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-6 border-t border-gray-100 mt-6">
                <button id="btnExport"
                    class="w-full py-4 px-4 bg-black text-white text-xs font-bold rounded-lg hover:opacity-80 transition flex items-center justify-center gap-2 shadow-lg active:scale-[0.98]">
                    <span>📸 高画質画像として保存 (PNG)</span>
                </button>
                <p class="ck-print-note">91×55mm / 600dpi・実寸情報つきPNG<br>印刷ソフトにそのまま置けば実寸で出ます</p>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'LIGHT',
            exportBg: '#ffffff',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'brandNameInput', target: 'displayBrandName', key: 'brandName' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'bgTextInput', target: 'displayBgText', key: 'bgText' },
                { input: 'codeNameLabelInput', target: 'displayCodeNameLabel', key: 'codeNameLabel' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'mfgCodeLabelInput', target: 'displayMfgCodeLabel', key: 'mfgCodeLabel' },
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' },
                { input: 'keySwitchLabelInput', target: 'displayKeySwitchLabel', key: 'keySwitchLabel' },
                { input: 'keySwitchInput', target: 'displayKeySwitch', key: 'keySwitch' },
                { input: 'keyCapsLabelInput', target: 'displayKeyCapsLabel', key: 'keyCapsLabel' },
                { input: 'keyCapsInput', target: 'displayKeyCaps', key: 'keyCaps' }
            ],
            ranges: [
                { input: 'bgTextSizeInput', display: 'bgTextSizeDisplay', target: 'displayBgText', style: 'fontSize', unit: 'pt', key: 'bgTextSize' }
            ],
            selects: [
                { input: 'fontSelect', cssVar: '--main-font', key: 'font' }
            ],
            accent: {
                cssVar: '--accent-color',
                default: '#E60012',
                labelDisplay: 'cmykValueDisplay',
                swatches: CardKit.CMYK
            }
        });
    </script>
</body>

</html>
