<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard Generator [CARTRIDGE]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=VT323&family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #e60012;
            --bg-color: #cfd4d8;
            --main-font: 'DotGothic16', sans-serif;
        }

        body {
            --ui-bg: #1e2025;
            --ui-panel: #2a2d34;
            --ui-panel-2: #1e2025;
            --ui-border: #3f4450;
            --ui-text: #e2e8f0;
            --ui-muted: #8a94a6;
            --ui-accent: var(--accent-color);
            --ui-accent-text: #fff;
        }

        .card {
            background-color: var(--bg-color);
            color: #1a1a1a;
            padding: 5mm;
            font-family: var(--main-font);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.8), inset 0 -4px 6px rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cart-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4mm;
            background: rgba(0, 0, 0, 0.08);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-arrow {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(0, 0, 0, 0.25);
        }

        .sticker-area {
            margin-top: 4mm;
            background: #ffffff;
            border: 2px solid #1a1a1a;
            border-radius: 4px;
            padding: 3mm 4mm;
            box-shadow: 2px 3px 0px rgba(0, 0, 0, 0.15);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-image: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(245,247,250,1) 100%);
        }

        .sticker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 1.5mm;
        }

        .brand-badge {
            background: var(--accent-color);
            color: #fff;
            padding: 1px 6px;
            border-radius: 12px;
            font-size: 8pt;
            font-family: 'Press Start 2P', cursive, sans-serif;
            letter-spacing: -0.5px;
        }

        .model-no {
            font-family: 'VT323', monospace;
            font-size: 9pt;
            color: #666;
        }

        .title-box {
            margin: 2mm 0;
        }

        .title-text {
            font-size: 14pt;
            font-weight: 900;
            color: #1a1a1a;
            line-height: 1.1;
        }

        .slogan-text {
            font-size: 7.5pt;
            color: #555;
            margin-top: 1mm;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5mm 3mm;
            background: rgba(0, 0, 0, 0.04);
            padding: 2mm;
            border-radius: 3px;
            border: 1px dashed #ccc;
        }

        .spec-item {
            font-size: 7pt;
            line-height: 1.2;
        }

        .spec-label {
            color: #777;
            font-size: 6pt;
            display: block;
        }

        .spec-val {
            font-weight: 700;
            color: #1a1a1a;
        }

        .dynamic-text { color: var(--accent-color) !important; }
        .dynamic-bg { background-color: var(--accent-color) !important; }
        .dynamic-border { border-color: var(--accent-color) !important; }
    </style>
</head>

<body>
    <div class="w-full max-w-6xl flex justify-between items-center mb-6 px-4">
        <a href="index.html" class="text-xs font-bold text-gray-400 hover:text-white transition">← MENU</a>
        <h1 class="text-lg font-black text-white tracking-tight uppercase">Cartridge Generator</h1>
        <div class="w-16"></div>
    </div>

    <div class="tool-container">
        <div class="file-system-panel bg-[#2a2d34] p-3 rounded-xl border border-gray-700 shadow-sm w-full">
            <label class="block text-[9px] font-bold text-red-400 uppercase tracking-widest mb-2">📄 ファイル保存レコード</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn" class="bg-[#1e2025] border border-red-500 text-red-400 text-[10px] py-2 rounded font-bold hover:bg-[#333] transition flex items-center justify-center gap-1"><span>📥 設定をJSONで保存</span></button>
                <button id="importJsonBtn" class="bg-[#1e2025] border border-blue-500 text-blue-400 text-[10px] py-2 rounded font-bold hover:bg-[#333] transition flex items-center justify-center gap-1"><span>📤 設定を読み込む</span></button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">
            </div>
        </div>

        <div id="captureArea" class="preview-area">
            <div class="card" id="productCard">
                <div class="cart-notch">
                    <div class="cart-arrow"></div>
                </div>

                <div class="sticker-area">
                    <div class="sticker-header">
                        <div class="brand-badge ck-fit" id="displayBrandName">KEYBOARD</div>
                        <div class="model-no" id="displayMfgCode">DMG-KB-JPN</div>
                    </div>

                    <div class="title-box">
                        <div class="title-text ck-fit" id="displayCodeName">AroundForty</div>
                        <div class="slogan-text ck-fit" id="displaySlogan">天下一キーボードわいわい会 vol.12</div>
                    </div>

                    <div class="specs-grid">
                        <div class="spec-item">
                            <span class="spec-label" id="displayLabel1">SWITCH</span>
                            <span class="spec-val ck-fit" id="displayVal1">Cherry MX Red</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label" id="displayLabel2">KEYCAPS</span>
                            <span class="spec-val ck-fit" id="displayVal2">PBT Double-shot</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label" id="displayLabel3">LAYOUT</span>
                            <span class="spec-val ck-fit" id="displayVal3">40% Split Ergonomic</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label" id="displayLabel4">BUILDER</span>
                            <span class="spec-val ck-fit" id="displayVal4">@user</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-panel ck-panel">
            <label class="ck-label" style="margin-bottom:1rem">🎨 カードを編集 [CARTRIDGE]</label>
            <div class="ck-field">
                <label class="ck-label" for="brandNameInput">メーカーロゴ / Brand</label>
                <input type="text" id="brandNameInput" class="ck-input" value="KEYBOARD">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="mfgCodeInput">型番 / Model No.</label>
                <input type="text" id="mfgCodeInput" class="ck-input" value="DMG-KB-JPN">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="codeNameInput">キーボード名 / Title</label>
                <input type="text" id="codeNameInput" class="ck-input" value="AroundForty">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="sloganInput">サブタイトル / Slogan</label>
                <input type="text" id="sloganInput" class="ck-input" value="天下一キーボードわいわい会 vol.12">
            </div>

            <div class="ck-field">
                <div class="ck-section-head"><label class="ck-label">テーマカラー / Color</label></div>
                <div class="color-swatch-grid" id="swatchGrid"></div>
            </div>

            <div class="ck-field">
                <label class="ck-label">項目1 (ラベル / 内容)</label>
                <input type="text" id="label1Input" class="ck-input" value="SWITCH" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val1Input" class="ck-input" value="Cherry MX Red">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目2 (ラベル / 内容)</label>
                <input type="text" id="label2Input" class="ck-input" value="KEYCAPS" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val2Input" class="ck-input" value="PBT Double-shot">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目3 (ラベル / 内容)</label>
                <input type="text" id="label3Input" class="ck-input" value="LAYOUT" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val3Input" class="ck-input" value="40% Split Ergonomic">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目4 (ラベル / 内容)</label>
                <input type="text" id="label4Input" class="ck-input" value="BUILDER" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val4Input" class="ck-input" value="@user">
            </div>

            <div style="margin-top:1.5rem">
                <button id="btnExport" class="ck-btn ck-btn-primary" style="width:100%">高画質PNGで保存</button>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'CARTRIDGE',
            exportBg: '#cfd4d8',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'brandNameInput', target: 'displayBrandName', key: 'brandName' },
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'label1Input', target: 'displayLabel1', key: 'label1' },
                { input: 'val1Input', target: 'displayVal1', key: 'val1' },
                { input: 'label2Input', target: 'displayLabel2', key: 'label2' },
                { input: 'val2Input', target: 'displayVal2', key: 'val2' },
                { input: 'label3Input', target: 'displayLabel3', key: 'label3' },
                { input: 'val3Input', target: 'displayVal3', key: 'val3' },
                { input: 'label4Input', target: 'displayLabel4', key: 'label4' },
                { input: 'val4Input', target: 'displayVal4', key: 'val4' }
            ],
            accent: {
                cssVar: '--accent-color',
                default: '#e60012',
                swatches: [
                    { hex: '#e60012', label: 'RED' }, { hex: '#0055bf', label: 'BLUE' },
                    { hex: '#008e43', label: 'GREEN' }, { hex: '#f09b00', label: 'YELLOW' },
                    { hex: '#633194', label: 'PURPLE' }, { hex: '#222222', label: 'DARK' }
                ]
            }
        });
    </script>
</body>

</html>
