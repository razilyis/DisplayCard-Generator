<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayCard Generator [NEWYORK]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Roboto+Condensed:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/cardkit.css">
    <style>
        :root {
            --accent-color: #0039a6;
            --bg-color: #111111;
            --main-font: 'Inter', sans-serif;
        }

        body {
            --ui-bg: #181818;
            --ui-panel: #242424;
            --ui-panel-2: #181818;
            --ui-border: #383838;
            --ui-text: #ffffff;
            --ui-muted: #888888;
            --ui-accent: var(--accent-color);
            --ui-accent-text: #fff;
        }

        .card {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 6mm 7mm;
            font-family: var(--main-font);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nyc-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 2mm;
        }

        .nyc-subway-route {
            display: flex;
            align-items: center;
            gap: 1.5mm;
        }

        .route-bullet {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            color: #ffffff;
            font-weight: 900;
            font-size: 8pt;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .nyc-station-tag {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 8.5pt;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #cccccc;
            text-transform: uppercase;
        }

        .nyc-title-box {
            margin: 2mm 0;
        }

        .nyc-title {
            font-size: 19pt;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: #ffffff;
            line-height: 1.05;
            text-transform: uppercase;
        }

        .nyc-sub {
            font-size: 7.5pt;
            color: #aaaaaa;
            margin-top: 1mm;
            font-weight: 700;
        }

        .nyc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5mm 4mm;
            background: #222222;
            border-left: 3px solid var(--accent-color);
            padding: 2.5mm 3.5mm;
        }

        .nyc-item-label {
            font-size: 5.5pt;
            color: #888888;
            display: block;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .nyc-item-val {
            font-size: 8.5pt;
            font-weight: 900;
            color: #ffffff;
        }

        .dynamic-text { color: var(--accent-color) !important; }
        .dynamic-bg { background-color: var(--accent-color) !important; }
        .dynamic-border { border-color: var(--accent-color) !important; }
    </style>
</head>

<body>
    <div class="w-full max-w-6xl flex justify-between items-center mb-6 px-4">
        <a href="index.html" class="text-xs font-bold text-gray-400 hover:text-white transition">← MENU</a>
        <h1 class="text-lg font-black text-white tracking-tight uppercase">New York Subway Sign Generator</h1>
        <div class="w-16"></div>
    </div>

    <div class="tool-container">
        <div class="file-system-panel bg-[#242424] p-3 rounded-xl border border-gray-700 shadow-sm w-full">
            <label class="block text-[9px] font-bold text-blue-400 uppercase tracking-widest mb-2">📄 ファイル保存レコード</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn" class="bg-[#181818] border border-blue-500 text-blue-400 text-[10px] py-2 rounded font-bold hover:bg-[#333] transition flex items-center justify-center gap-1"><span>📥 設定をJSONで保存</span></button>
                <button id="importJsonBtn" class="bg-[#181818] border border-emerald-500 text-emerald-400 text-[10px] py-2 rounded font-bold hover:bg-[#333] transition flex items-center justify-center gap-1"><span>📤 設定を読み込む</span></button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">
            </div>
        </div>

        <div id="captureArea" class="preview-area">
            <div class="card" id="productCard">
                <div>
                    <div class="nyc-top-bar">
                        <div class="nyc-subway-route">
                            <span class="route-bullet">A</span>
                            <span class="route-bullet" style="background:#ff6319">F</span>
                            <span class="route-bullet" style="background:#fccc0a;color:#000">N</span>
                        </div>
                        <span class="nyc-station-tag" id="displayMfgCode">40TH ST // NYC</span>
                    </div>

                    <div class="nyc-title-box">
                        <div class="nyc-title ck-fit" id="displayCodeName">AroundForty</div>
                        <div class="nyc-sub ck-fit" id="displaySlogan">recorded at 天下一キーボードわいわい会 vol.12</div>
                    </div>
                </div>

                <div class="nyc-grid">
                    <div>
                        <span class="nyc-item-label" id="displayLabel1">SWITCH</span>
                        <span class="nyc-item-val ck-fit" id="displayVal1">Cherry MX Red</span>
                    </div>
                    <div>
                        <span class="nyc-item-label" id="displayLabel2">KEYCAPS</span>
                        <span class="nyc-item-val ck-fit" id="displayVal2">PBT Double-shot</span>
                    </div>
                    <div>
                        <span class="nyc-item-label" id="displayLabel3">SPEC</span>
                        <span class="nyc-item-val ck-fit" id="displayVal3">40% Split Ergonomic</span>
                    </div>
                    <div>
                        <span class="nyc-item-label" id="displayLabel4">PASSENGER</span>
                        <span class="nyc-item-val ck-fit" id="displayVal4">@user</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-panel ck-panel">
            <label class="ck-label" style="margin-bottom:1rem">🎨 カードを編集 [NEWYORK]</label>
            <div class="ck-field">
                <label class="ck-label" for="mfgCodeInput">ステーションタグ / Station Tag</label>
                <input type="text" id="mfgCodeInput" class="ck-input" value="40TH ST // NYC">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="codeNameInput">キーボード名 / Title</label>
                <input type="text" id="codeNameInput" class="ck-input" value="AroundForty">
            </div>
            <div class="ck-field">
                <label class="ck-label" for="sloganInput">サブタイトル / Slogan</label>
                <input type="text" id="sloganInput" class="ck-input" value="recorded at 天下一キーボードわいわい会 vol.12">
            </div>

            <div class="ck-field">
                <div class="ck-section-head"><label class="ck-label">サブウェイカラー / Route Color</label></div>
                <div class="color-swatch-grid" id="swatchGrid"></div>
            </div>

            <div class="ck-field">
                <label class="ck-label">項目1 (ラベル / 内容)</label>
                <input type="text" id="label1Input" class="ck-input" value="SWITCH" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val1Input" class="ck-input" value="Cherry MX Red">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目2 (ラベル / 内容)</label>
                <input type="text" id="label2Input" class="ck-input" value="KEYCAPS" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val2Input" class="ck-input" value="PBT Double-shot">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目3 (ラベル / 内容)</label>
                <input type="text" id="label3Input" class="ck-input" value="SPEC" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val3Input" class="ck-input" value="40% Split Ergonomic">
            </div>
            <div class="ck-field">
                <label class="ck-label">項目4 (ラベル / 内容)</label>
                <input type="text" id="label4Input" class="ck-input" value="PASSENGER" style="font-size:10px;margin-bottom:4px">
                <input type="text" id="val4Input" class="ck-input" value="@user">
            </div>

            <div style="margin-top:1.5rem">
                <button id="btnExport" class="ck-btn ck-btn-primary" style="width:100%">高画質PNGで保存</button>
            </div>
        </div>
    </div>

    <div id="exportStatus"></div>

    <script src="assets/cardkit.js"></script>
    <script>
        CardKit({
            theme: 'NEWYORK',
            exportBg: '#111111',
            nameSource: 'codeNameInput',
            fields: [
                { input: 'mfgCodeInput', target: 'displayMfgCode', key: 'mfgCode' },
                { input: 'codeNameInput', target: 'displayCodeName', key: 'codeName' },
                { input: 'sloganInput', target: 'displaySlogan', key: 'slogan' },
                { input: 'label1Input', target: 'displayLabel1', key: 'label1' },
                { input: 'val1Input', target: 'displayVal1', key: 'val1' },
                { input: 'label2Input', target: 'displayLabel2', key: 'label2' },
                { input: 'val2Input', target: 'displayVal2', key: 'val2' },
                { input: 'label3Input', target: 'displayLabel3', key: 'label3' },
                { input: 'val3Input', target: 'displayVal3', key: 'val3' },
                { input: 'label4Input', target: 'displayLabel4', key: 'label4' },
                { input: 'val4Input', target: 'displayVal4', key: 'val4' }
            ],
            accent: {
                cssVar: '--accent-color',
                default: '#0039a6',
                swatches: [
                    { hex: '#0039a6', label: 'E/A/C BLUE' }, { hex: '#ff6319', label: 'B/D/F ORANGE' },
                    { hex: '#fccc0a', label: 'N/Q/R YELLOW' }, { hex: '#00933c', label: '4/5/6 GREEN' },
                    { hex: '#ee352e', label: '1/2/3 RED' }, { hex: '#b933ad', label: '7 PURPLE' }
                ]
            }
        });
    </script>
</body>

</html>
